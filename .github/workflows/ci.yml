name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une nouvelle poussée annule l'exécution précédente sur la même référence :
# inutile de payer deux fois pour un code déjà remplacé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend — lint, tests, migrations
    runs-on: ubuntu-latest

    services:
      # Redis fait tourner le test d'intégration de la limitation de débit,
      # ignoré quand aucun serveur n'est joignable.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Les tests tournent sur SQLite, mais la production vise PostgreSQL :
      # les migrations doivent être vérifiées sur leur vraie cible.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: filmfund
          POSTGRES_PASSWORD: filmfund
          POSTGRES_DB: filmfund_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dépendances
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Tests (pytest)
        working-directory: backend
        run: pytest

      - name: Migrations sur PostgreSQL
        working-directory: backend
        env:
          ENVIRONMENT: development
          JWT_SECRET: ci-secret-sans-valeur
          AI_PROVIDER: mock
          DATABASE_URL: postgresql+psycopg://filmfund:filmfund@localhost:5432/filmfund_ci
        run: alembic upgrade head

      - name: Aucune dérive entre les modèles et les migrations
        working-directory: backend
        env:
          ENVIRONMENT: development
          JWT_SECRET: ci-secret-sans-valeur
          AI_PROVIDER: mock
          DATABASE_URL: postgresql+psycopg://filmfund:filmfund@localhost:5432/filmfund_ci
        # Échoue si un modèle a changé sans migration : la dérive se découvrirait
        # sinon au déploiement, sur la base réelle.
        run: alembic check

  frontend:
    name: Frontend — typage, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Typage strict
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build de production
        working-directory: frontend
        run: npm run build

  e2e:
    name: Parcours de bout en bout (Playwright)
    runs-on: ubuntu-latest
    # Inutile de lancer un navigateur si le code ne compile même pas.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances backend
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Installer Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Parcours critiques
        working-directory: frontend
        # Playwright démarre lui-même l'API jetable et le frontend.
        run: npm run test:e2e

      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
